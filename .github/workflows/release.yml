name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job can publish
    env:
      # Never interpolate ${{ }} directly into scripts: tag names are
      # attacker-influenced text.
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate tag
        run: printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
      - run: make vet dist VERSION="$TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Muster $TAG" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/$REPO/main/install.sh | sh\`. See CHANGELOG.md for what's new." \
            --verify-tag
      - name: Render Homebrew formula
        run: REPO="$REPO" ./packaging/homebrew/render.sh "$TAG" dist/SHA256SUMS > muster.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: muster.rb
